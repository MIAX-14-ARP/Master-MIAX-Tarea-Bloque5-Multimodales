[server]
# Límite de subida (MB): controla el coste y la memoria; el audio de OpenAI admite hasta 25 MB.
maxUploadSize = 30

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# «Terminal de research editorial»: tinta cálida, hueso y un único acento latón.
# Los mismos tokens viven en src/finlens/ui/theme.py (CSS inyectado).
[theme]
base = "dark"
primaryColor = "#C8A24A"
backgroundColor = "#12110E"
secondaryBackgroundColor = "#1C1A16"
textColor = "#EDE6D6"
borderColor = "#3A372E"
linkColor = "#C8A24A"
greenColor = "#6CC38A"
redColor = "#E8716A"
baseRadius = "2px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
chartCategoricalColors = ["#C8A24A", "#BDB4A2", "#6CC38A", "#E8716A", "#7D7667"]
