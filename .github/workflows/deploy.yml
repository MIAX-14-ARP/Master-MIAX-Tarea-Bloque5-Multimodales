name: Deploy (AWS)

# Construye la imagen Docker, la sube a ECR, sincroniza los secretos en AWS Secrets Manager y
# actualiza la instancia EC2 por SSM. Autenticación con OIDC: no hay claves de AWS en GitHub.
# Se ejecuta cuando la CI pasa en master, o a mano (workflow_dispatch).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC con AWS
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: finlens

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen
        id: imagen
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGEN="$REGISTRO/$ECR_REPOSITORY:$TAG"
          docker build -t "$IMAGEN" -t "$REGISTRO/$ECR_REPOSITORY:latest" .
          docker push "$IMAGEN"
          docker push "$REGISTRO/$ECR_REPOSITORY:latest"
          echo "imagen=$IMAGEN" >> "$GITHUB_OUTPUT"

      - name: Sincronizar secretos en AWS Secrets Manager
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "Falta el secreto OPENROUTER_API_KEY"; exit 1; }
          jq -n --arg k "$OPENROUTER_API_KEY" --arg p "$APP_PASSWORD" \
            '{OPENROUTER_API_KEY: $k, APP_PASSWORD: $p}' > /tmp/secreto.json
          aws secretsmanager put-secret-value --secret-id finlens/app \
            --secret-string file:///tmp/secreto.json > /dev/null
          rm -f /tmp/secreto.json

      - name: Desplegar en EC2 (SSM)
        env:
          INSTANCIA: ${{ vars.FINLENS_INSTANCE_ID }}
          IMAGEN: ${{ steps.imagen.outputs.imagen }}
        run: |
          SCRIPT=$(base64 -w0 deploy/deploy.sh)
          COMANDOS=$(jq -n --arg s "$SCRIPT" --arg i "$IMAGEN" \
            '{commands: ["echo \($s) | base64 -d > /opt/finlens/deploy.sh", "chmod 700 /opt/finlens/deploy.sh", "/opt/finlens/deploy.sh \($i)"]}')
          ID=$(aws ssm send-command --instance-ids "$INSTANCIA" --document-name AWS-RunShellScript \
            --comment "FinLens ${GITHUB_SHA::7}" --parameters "$COMANDOS" --query Command.CommandId --output text)
          # Espera hasta 10 min (la primera vez descarga la imagen base y Caddy pide el certificado).
          for _ in $(seq 1 60); do
            sleep 10
            ESTADO=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$ESTADO" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCIA" \
            --query '{estado: Status, salida: StandardOutputContent, error: StandardErrorContent}' --output json
          test "$ESTADO" = "Success"
