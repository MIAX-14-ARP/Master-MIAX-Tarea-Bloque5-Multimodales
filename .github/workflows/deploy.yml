name: Deploy (AWS)

# Construye la imagen Docker, la sube a ECR, sincroniza los secretos en AWS Secrets Manager y
# actualiza la instancia EC2 por SSM. Autenticación con OIDC: no hay claves de AWS en GitHub.
# Se ejecuta cuando la CI pasa tras un push a master del propio repositorio, o a mano.
#
# Seguridad:
# - El rol de AWS solo confía en tokens del environment `produccion` de este repositorio
#   (sub = repo:<repo>:environment:produccion). Configurar en Settings → Environments → produccion:
#   rama permitida `master` y, si se quiere, revisores obligatorios.
# - `workflow_run` corre en el contexto del repo base con secretos: por eso se exige que la CI viniera
#   de un push (no de un pull_request) a master del MISMO repositorio. Un PR desde un fork, aunque su
#   rama se llame master, no despliega.
# - Actions fijadas por SHA de commit.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC con AWS
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: finlens

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2

      - name: Construir y subir imagen
        id: imagen
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGEN="$REGISTRO/$ECR_REPOSITORY:$TAG"
          docker build -t "$IMAGEN" -t "$REGISTRO/$ECR_REPOSITORY:latest" .
          docker push "$IMAGEN"
          docker push "$REGISTRO/$ECR_REPOSITORY:latest"
          echo "imagen=$IMAGEN" >> "$GITHUB_OUTPUT"

      - name: Sincronizar secretos en AWS Secrets Manager
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "Falta el secreto OPENROUTER_API_KEY"; exit 1; }
          # La demo es pública y cada análisis gasta crédito: sin contraseña no se despliega.
          test -n "$APP_PASSWORD" || { echo "Falta el secreto APP_PASSWORD"; exit 1; }
          umask 077
          jq -n --arg k "$OPENROUTER_API_KEY" --arg p "$APP_PASSWORD" \
            '{OPENROUTER_API_KEY: $k, APP_PASSWORD: $p}' > "$RUNNER_TEMP/secreto.json"
          aws secretsmanager put-secret-value --secret-id finlens/app \
            --secret-string "file://$RUNNER_TEMP/secreto.json" > /dev/null
          rm -f "$RUNNER_TEMP/secreto.json"

      - name: Desplegar en EC2 (SSM)
        env:
          INSTANCIA: ${{ vars.FINLENS_INSTANCE_ID }}
          IMAGEN: ${{ steps.imagen.outputs.imagen }}
        run: |
          SCRIPT=$(base64 -w0 deploy/deploy.sh)
          COMANDOS=$(jq -n --arg s "$SCRIPT" --arg i "$IMAGEN" \
            '{commands: ["echo \($s|@sh) | base64 -d > /opt/finlens/deploy.sh", "chmod 700 /opt/finlens/deploy.sh", "/opt/finlens/deploy.sh \($i|@sh)"]}')
          ID=$(aws ssm send-command --instance-ids "$INSTANCIA" --document-name AWS-RunShellScript \
            --comment "FinLens ${GITHUB_SHA::7}" --parameters "$COMANDOS" --query Command.CommandId --output text)
          # Espera hasta 10 min (la primera vez descarga la imagen base y Caddy pide el certificado).
          ESTADO=Pending
          for _ in $(seq 1 60); do
            sleep 10
            ESTADO=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$ESTADO" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCIA" \
            --query '{estado: Status, salida: StandardOutputContent, error: StandardErrorContent}' --output json
          test "$ESTADO" = "Success"
